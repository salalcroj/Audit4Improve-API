name: Flujo de trabajo para construir y testear
on:
  workflow_dispatch:
  push:
    branches: [ V.0.2 ]
  pull_request:
    branches: [ V.0.2 ]
  schedule:
    - cron: '1 23 * * 0-4'

jobs:
  build:
    name: 🏗️ Construir artefacto
    runs-on: ubuntu-latest
    env:
      GITHUB_LOGIN: ${{ github.actor }}
      GITHUB_PACKAGES: ${{ secrets.GHTOKEN }}
      GITHUB_OAUTH: ${{ secrets.GHTOKEN }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Java 16
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Ejecutar build
        run: |
          chmod +x gradlew
          ./gradlew assemble

  test:
    name: ✅ Ejecutar tests
    runs-on: ubuntu-latest
    needs: build
    env:
      GITHUB_LOGIN: ${{ github.actor }}
      GITHUB_PACKAGES: ${{ secrets.GHTOKEN }}
      GITHUB_OAUTH: ${{ secrets.GHTOKEN }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Java 16
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Ejecutar tests
        run: |
          chmod +x gradlew
          ./gradlew test
